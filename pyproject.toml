[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rb2traktor"
version = "0.1.0"
description = "Sync BPM, musical key and beatgrid from Rekordbox to Traktor"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[project.scripts]
rb2traktor = "rb2traktor.cli:main"

[tool.setuptools]
packages = ["rb2traktor"]
